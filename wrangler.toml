# Cloudflare configuration for Pages deployment.
#
# This file declares the runtime baseline (compatibility date, Node.js compat,
# build output) that applies to both production and local `wrangler pages dev`.
#
# Production bindings (KV namespaces, secrets, env vars) are managed in the
# Cloudflare dashboard:
#   Pages → americansforpropriety → Settings → Bindings
#   Pages → americansforpropriety → Settings → Environment variables
#
# After creating the SESSION KV namespace via `wrangler kv namespace create SESSION`
# (or via the dashboard), uncomment the [[kv_namespaces]] block below and paste
# the namespace IDs. The Astro Cloudflare adapter auto-wires Astro.session to
# this binding when present — we don't use Astro.session today (auth flows
# through Supabase HTTP-only cookies), but the binding silences the adapter's
# session-helper warning and is available for future use.

name = "americansforpropriety"
compatibility_date = "2026-05-10"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

## D1 database binding for Better Auth + app data.
## Create the database with:
##   wrangler d1 create americansforpropriety
## Paste the returned database_id below, then commit. Migrations are applied
## with `npm run db:migrate:prod` (production) or `db:migrate:local` (dev).
[[d1_databases]]
binding = "DB"
database_name = "americansforpropriety"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

## Optional: Astro Sessions KV (not currently used; auth runs through Better
## Auth's own session store backed by D1). Leave commented unless we adopt
## Astro.session() somewhere in app code.
# [[kv_namespaces]]
# binding = "SESSION"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"
# preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"
